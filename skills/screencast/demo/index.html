<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Screencast Demo</title>
    <style>
      body {
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui;
        display: grid;
        place-items: center;
        height: 100vh;
        margin: 0;
      }
      time {
        font-size: 5rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <time id="clock"></time>
    <script>
      const clock = document.getElementById("clock");
      const tick = () => {
        const d = new Date();
        clock.textContent =
          d.toLocaleTimeString("en-GB") + "." + String(d.getMilliseconds()).padStart(3, "0");
      };
      tick();
      setInterval(tick, 5);
    </script>
  </body>
</html>
